name: Bridge quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit --incremental false -p tsconfig.json
      - run: npm run test:bridge
      - run: npm run test:auto-bridge
      - run: node --no-warnings --import ./test/register-ts-alias.mjs --test test/wallets.test.mjs
      - run: npm run test:i18n
      - run: npm run build
